
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Roadmap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
            color: #243047;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #16805d;
        }

        .role {
            background: #e5f7ef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .content {
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            margin: 5px;
            background: #16805d;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: #105c43;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                color: black;
            }

            .container {
                max-width: 100%;
                padding: 15px;
                box-shadow: none;
                border-radius: 0;
            }

            .no-print {
                display: none !important;
            }

            h1 {
                color: black;
            }

            .role {
                background: white;
                border: 1px solid #cccccc;
            }

            .content {
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>AI Personalized Learning Roadmap</h1>

        <div class="role">
            <strong>Target Job Role:</strong>
            {{ job_role.role_name }}
        </div>

        <h2>Your Learning Plan</h2>

        <div class="content">{{ roadmap }}</div>

        <br>

        <!-- Download Roadmap as PDF -->
        <button type="button" class="btn no-print"
                onclick="window.print()">
            Download Roadmap as PDF
        </button>

        <!-- Existing Buttons -->
        <a href="{{ url_for('ai_career') }}" class="btn no-print">
            Back to Career Guidance
        </a>

        <a href="{{ url_for('progress') }}" class="btn no-print">
            Track Learning Progress
        </a>

        <a href="{{ url_for('dashboard') }}" class="btn no-print">
            Dashboard
        </a>

    </div>
</body>
</html>
